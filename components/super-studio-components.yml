storefront_templating:
  kind: Server-side theme layer, not a component package
  language: Liquid
  docs: https://docs.ec-force.com/
  description: >-
    ecforce storefronts are built from Liquid themes with documented shop pages, layouts and partial
    templates, plus a published (beta) Liquid object and page-variable reference. This is the
    supported customisation surface for merchants who are not going headless.
  agent_relevance: >-
    The ecforce AI MCP server can write HTML/CSS/JavaScript straight into an LP template, so this
    templating layer is also an agent write surface.
