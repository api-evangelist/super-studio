standards:
- id: json:api
  conforms: true
  confidence: high
  evidence: >-
    The ecforce v2 API returns JSON:API compound documents — { data: [ { id, type, attributes,
    relationships } ], included: [...] } — and supports the include query parameter to hoist related
    resources into included[]. Read from first-party code at
    github.com/super-studio/ecforce_headless src/lib/ecforce-sdk/admin/products/endpoints.ts and
    .../types.ts. SUPER STUDIO does not advertise JSON:API conformance anywhere; the contract shape
    does.
  caveat: >-
    Shape conformance only. The JSON:API media type (application/vnd.api+json), links objects, and
    the spec's own pagination/error members are not observed — the client sends and receives
    application/json and the error envelope is a bare errors[] of message strings, not JSON:API
    error objects.
- id: oauth2
  conforms: true
  confidence: high
  evidence: >-
    https://agent.ec-force.com/.well-known/oauth-authorization-server returns 200 application/json
    with issuer, authorization_endpoint, token_endpoint, registration_endpoint, revocation_endpoint,
    grant_types_supported [authorization_code, refresh_token] and scopes_supported [mcp].
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata
  conforms: true
  confidence: high
  evidence: The .well-known/oauth-authorization-server document above.
- id: rfc7591
  name: OAuth 2.0 Dynamic Client Registration
  conforms: true
  confidence: high
  evidence: >-
    POST https://agent.ec-force.com/mcp/oauth/register with client_name and redirect_uris returned
    200 with a client_id, client_id_issued_at, grant_types, response_types, scope "mcp" and
    token_endpoint_auth_method "none". Probed anonymously 2026-08-29.
- id: rfc7636
  name: PKCE
  conforms: true
  confidence: high
  evidence: code_challenge_methods_supported ["S256"] in the authorization server metadata.
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: false
  evidence: >-
    /.well-known/oauth-protected-resource returns 404 on agent.ec-force.com, and so does
    /.well-known/oauth-protected-resource/mcp. An MCP client cannot discover the resource server
    from the resource itself; only the authorization server advertises.
- id: mcp
  name: Model Context Protocol
  conforms: true
  confidence: medium
  evidence: >-
    SUPER STUDIO announced an MCP connection feature for ecforce AI on 2026-08-04 naming Claude
