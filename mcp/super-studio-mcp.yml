    What IS anonymously verified is the authorization server: agent.ec-force.com serves RFC 8414
    metadata whose issuer is https://agent.ec-force.com and whose OAuth endpoints all live under
    /mcp/oauth/*, and POST /mcp/oauth/register returns a real client_id. Probes of /mcp, /sse,
