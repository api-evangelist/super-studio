apis:
- name: ecforce API v2
  description: >-
    The ecforce platform REST API. Version 2 splits into v2/admin (administrator-scoped, mirroring
    the ecforce management screens) and v2/customer (shopper-scoped, mirroring My Page). Responses
    are JSON:API shaped — a data[] document with type/id/attributes/relationships plus an included[]
    compound-document array driven by an include query parameter — and collection filtering uses
    Ransack-style q[<attribute>_<predicate>] parameters. Authentication is a per-merchant API
    connection user whose access token is sent as Authorization: Token token="<token>". The API is a
    paid contract option and the reference is served only to authenticated customers.
  humanURL: https://apidoc.ec-force.com/apidoc/v2/admin/index.html
  baseURL: https://api.{shop-domain}
  tags:
  - E-Commerce
  - Order Management
  - REST
  properties:
  - type: APIReference
    url: https://apidoc.ec-force.com/apidoc/v2/admin/index.html
  - type: Authentication
    url: authentication/super-studio-authentication.yml
  - type: Webhooks
    url: asyncapi/super-studio-ecforce-webhooks.yml
  - type: ErrorCatalog
    url: errors/super-studio-problem-types.yml
  - type: SourceCode
    url: https://github.com/super-studio/ecforce_headless
- name: ecforce AI Agent API
  description: >-
    The internal HTTP API behind ecforce AI, called from the first-party
    @super_studio/ecforce-ai-agent-server npm SDK. It issues chat session tokens, resolves users,
    records terms acceptance, returns per-project credit usage summaries (/v1/internal/usage/summary)
    and proxies OpenAI / Google Vertex / Anthropic model calls so usage is billed against an ecforce
    project. Authentication is an API key issued in the ecforce admin screens and supplied as
    AI_AGENT_API_KEY; a dev environment is published at https://dev-agent.ec-force.com.
  humanURL: https://www.npmjs.com/package/@super_studio/ecforce-ai-agent-server
  baseURL: https://agent.ec-force.com
  tags:
  - Artificial Intelligence
  - Agents
  properties:
  - type: SDKs
    url: https://www.npmjs.com/package/@super_studio/ecforce-ai-agent-server
  - type: TermsOfService
    url: https://agent.ec-force.com/terms
- name: ecforce AI MCP
  description: >-
    A remote, OAuth-protected Model Context Protocol server launched 2026-08-04 that lets external AI
    tools (Claude Code, Cursor, the ChatGPT app/Codex) read ecforce order and product data, query
    ecforce AIdp knowledge, run ecforce bi analysis, configure ecforce ma delivery and write LP
    template code, all inside the signed-in ecforce account's permission scope. The authorization
    server metadata is served anonymously at agent.ec-force.com and advertises RFC 7591 dynamic
    client registration, authorization_code + refresh_token grants, PKCE S256 and a single "mcp"
    scope. Available to paid ecforce AI contracts only.
  humanURL: https://ec-force.com/information/20260804
  baseURL: https://agent.ec-force.com
  tags:
  - MCP
  - Agents
  properties:
  - type: MCPServer
    url: mcp/super-studio-mcp.yml
  - type: OAuthScopes
    url: scopes/super-studio-scopes.yml
