aid: super-studio
name: SUPER STUDIO
description: >-
  SUPER STUDIO (株式会社SUPER STUDIO) is a Tokyo-based commerce software company founded in 2014 that
  builds "ecforce", an AI commerce platform used by Japanese D2C and subscription brands for
  storefronts, order management, subscriptions, CRM, marketing automation and BI. The platform is
  multi-tenant and API-integrable: ecforce exposes a versioned REST admin/customer API (v2, JSON:API
  shaped, token authenticated) on each merchant's own shop host, a webhook surface signalled with an
  x-ecf-event header, and — since August 2026 — an OAuth-protected remote MCP server under
  agent.ec-force.com that lets external AI tools such as Claude Code, Cursor and the ChatGPT app read
  ecforce order and product data and drive ecforce bi, ma and AIdp. SUPER STUDIO also publishes
  first-party npm packages for the ecforce AI Agent (server SDK and React chat UI) and the "albers"
  design system. The API reference itself sits behind HTTP Basic auth at apidoc.ec-force.com and API
  integration is a paid contract option.
