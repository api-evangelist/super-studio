format: vendor-json
rfc9457: false
note: >-
  ecforce does not use application/problem+json. Its error envelope is a JSON object with a top-level
  errors[] array of objects carrying a message string. Titles, codes and remediation for individual
  errors are published only in the Basic-auth-gated reference at apidoc.ec-force.com, so this catalog
  records the envelope and the status semantics that first-party code actually branches on — nothing
  more. The v2 release notice states that v2 kept v1's request and success-response shapes but
  CHANGED the error responses, so v1-era error handling is not portable.
envelope:
  content_type: application/json
  shape: '{ "errors": [ { "message": "<human readable message>" } ] }'
  fields:
  - name: errors
    type: array
    required: true
  - name: errors[].message
    type: string
    required: true
    description: Human-readable message; the first-party client joins these with ", " for display.
problem_types:
- status: 404
  name: NotFound
  meaning: The addressed resource does not exist.
  client_behaviour: >-
    The first-party SDK special-cases 404 and raises a distinct NotFoundError rather than a generic
    failure, so 404 is a modelled outcome and not just an error.
  source: src/lib/ecforce-sdk/shared/index.ts
- status: 4xx
  name: RequestError
  meaning: Any other client error; body carries the errors[] envelope.
  client_behaviour: Generic throw carrying status, statusText and the raw body.
  source: src/lib/ecforce-sdk/shared/index.ts
- status: 5xx
  name: ServerError
  meaning: Server-side failure.
  client_behaviour: Same generic path as 4xx; no retry or backoff logic is demonstrated.
  source: src/lib/ecforce-sdk/shared/index.ts
